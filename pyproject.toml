[project]
name = "httpstatus"
version = "0.1.0"
description = "HTTP status code reference and lookup CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Hermes Agent", email = "hermes@nousresearch.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
httpstatus = "httpstatus:main"

[tool.setuptools]
py-modules = ["httpstatus"]
